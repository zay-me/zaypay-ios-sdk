name: zaypay_flutter
description: "Flutter wrapper for Zay Pay SDK"
version: 1.0.0
homepage: https://github.com/zay-me/zaypay-ios-sdk

environment:
  sdk: ^3.9.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2
  webview_flutter: ^4.13.0

dev_dependencies:
  flutter_lints: ^5.0.0

flutter:
  plugin:
    platforms:
      android:
        package: me.zay.paykit.flutter.zaypay_flutter
        pluginClass: ZayPayFlutterPlugin
      ios:
        pluginClass: ZayPayFlutterPlugin
